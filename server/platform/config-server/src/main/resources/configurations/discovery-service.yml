eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: false  # This IS the Eureka server, so it doesn't register with itself
    fetchRegistry: false  # No need to fetch a registry it already owns
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
server:
  port: 8761  # Standard Eureka dashboard/API port
