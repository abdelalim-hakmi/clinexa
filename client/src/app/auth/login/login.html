<main class="login">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Clinexa</h1>
    <p class="subtitle">Log in to your space.</p>

    <label for="email">Email address</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="username"
      autocapitalize="off"
      spellcheck="false"
      [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
    />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="help">Enter a valid email address.</p>
    }

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
    />

    <!--
      A single error message, the server's own. It does not distinguish "unknown account" from
      "wrong password", and the screen must not reconstruct the difference.
      role="alert" so screen readers announce it without waiting for a focus change.
    -->
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>
</main>
